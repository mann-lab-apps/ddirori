name: Browser QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ddirori-browser-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install Chromium for Playwright
        run: |
          npm ci
          npx --no-install playwright install --with-deps --only-shell chromium
      - name: Build the QA site
        run: node scripts/build.mjs
      - name: Run browser checks against the local site
        env:
          DDIRORI_LANDING_URL: http://127.0.0.1:8110/
          DDIRORI_LANDING_EVIDENCE: out/browser-qa/layout
        run: |
          mkdir -p out/browser-qa
          python3 -u -m http.server 8110 --bind 127.0.0.1 --directory dist > out/browser-qa/http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-delay 1 --max-time 3 "$DDIRORI_LANDING_URL" > /dev/null

          status=0
          node scripts/verify-browser.mjs 2>&1 | tee out/browser-qa/layout.log || status=1
          node scripts/verify-studio-analytics-browser.mjs 2>&1 | tee out/browser-qa/studio.log || status=1
          exit "$status"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: browser-qa
          path: out/browser-qa
          if-no-files-found: ignore
          retention-days: 7
